# Example: a small reverse proxy with a static tree, a ^~ API prefix,
# regex locations, a named location and a rewrite loop guard.
worker_processes 1;

http {
    server {
        listen 80 default_server;
        server_name example.com www.example.com;

        location = /exact {
            return 200;
        }

        location ^~ /api/ {
            proxy_pass http://backend;
        }

        location /api/v1/ {
            # longest prefix wins over ^~ /api/; with no matching regex nginx
            # falls back to THIS block, then try_files hands off to @fallback
            try_files $uri @fallback;
        }

        location ~ \.php$ {
            fastcgi_pass unix:/run/php.sock;
        }

        location ~* \.(png|jpg|gif)$ {
            expires 30d;
        }

        location /static/ {
            root /var/www;
        }

        location / {
            try_files $uri $uri/ @fallback;
        }

        location @fallback {
            proxy_pass http://app;
        }

        location = /exact {
            # duplicate of the block above: nginx keeps the first one
            return 204;
        }
    }

    server {
        listen 80;
        server_name api.example.com;

        location / {
            rewrite ^/old/(.*)$ /new/$1 last;
        }

        location /new/ {
            return 200;
        }

        location /loop/ {
            rewrite ^ /loop/ last;
        }
    }
}
